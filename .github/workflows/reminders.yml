name: Plant care reminders

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the reminder endpoint
        run: |
          curl -fsS -X GET "${{ secrets.APP_URL }}/api/cron/check-due" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
